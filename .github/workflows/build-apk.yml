name: Build Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx4G -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Verify dist directory
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory not found after build"
            exit 1
          fi
          ls dist/ | head -10

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -20

      - name: Locate APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*-debug.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            ls -laR android/app/build/outputs/apk/ 2>/dev/null || echo "No output dir"
            exit 1
          fi
          echo "APK found at: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omix-community-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30
