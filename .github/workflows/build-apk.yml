name: Build Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Verify dist directory
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory not found after build"
            exit 1
          fi
          ls dist/ | head -10

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: 26.1.10909125
          ndk-type: ndkVersion

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -Prelease

      - name: Locate APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*-release.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi
          ls -la $APK_PATH

      - name: Zip APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*-release.apk" | head -1)
          cd android/app/build/outputs/apk
          zip -j omix-community-apk.zip $APK_PATH

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omix-community-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: omix-community-apk-zip
          path: android/app/build/outputs/apk/omix-community-apk.zip
          retention-days: 30
