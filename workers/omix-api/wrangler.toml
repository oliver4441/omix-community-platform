name = "omix-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# ── Database (D1, replaces Supabase Postgres) ──
# Create once:  npx wrangler d1 create omix-db
# then paste the returned database_id below and run:
#   npx wrangler d1 migrations apply omix-db -c workers/omix-api/wrangler.toml
[[d1_databases]]
binding = "DB"
database_name = "omix-db"
database_id = "55de740c-6c82-4291-b3ad-621398eb4854"
migrations_dir = "../migrations"

# ── File storage (R2, replaces Supabase Storage) ──
# TEMP: disabled until R2 is enabled on the account (dashboard → R2 → enable).
# Then:  npx wrangler r2 bucket create omix-assets && restore this block + redeploy.
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "omix-assets"

[vars]
CORS_ORIGIN = "https://omix-systems-cd1af.web.app"
# Frontend origin used for email links + GitHub OAuth redirects, e.g. https://omix.app
APP_ORIGIN = "https://omix-systems-cd1af.web.app"

# Secrets (wrangler secret put / CI — never commit):
#   ABLY_API_KEY          — Ably API key
#   GITHUB_CLIENT_ID      — GitHub OAuth app client id
#   GITHUB_CLIENT_SECRET  — GitHub OAuth app client secret
#   RESEND_API_KEY        — transactional email (verification / password reset)
#   EMAIL_FROM            — optional sender, e.g. "Omix <onboarding@resend.dev>"
#   TOKEN_AUTH_SECRET     — optional shared secret gate for /ably/token
