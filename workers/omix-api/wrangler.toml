name = "omix-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "omix-db"
database_id = "55de740c-6c82-4291-b3ad-621398eb4854"
migrations_dir = "../migrations"

[[kv_namespaces]]
binding = "ASSETS"
id = "0200ed9d4dd542d184fb2bcb9b24f363"

[vars]
CORS_ORIGIN = "https://omix-community.vercel.app"
APP_ORIGIN = "https://omix-community.vercel.app"

# Secrets (wrangler secret put / CI — never commit):
# ABLY_API_KEY
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# RESEND_API_KEY
# EMAIL_FROM
# TOKEN_AUTH_SECRET
