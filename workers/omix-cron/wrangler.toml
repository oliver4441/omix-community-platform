name = "omix-cron"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Runs every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# Same D1 database as omix-api
[[d1_databases]]
binding = "DB"
database_name = "omix-db"
database_id = "55de740c-6c82-4291-b3ad-621398eb4854"
migrations_dir = "../migrations"
