name = "omix-chat"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# Internal-only: reachable exclusively via the omix-gateway service binding.
workers_dev = false

# ── Database (D1, shared by all Omix workers) ──
[[d1_databases]]
binding = "DB"
database_name = "omix-db"
database_id = "55de740c-6c82-4291-b3ad-621398eb4854"
migrations_dir = "../migrations"

[vars]
CORS_ORIGIN = "https://omix-systems-cd1af.web.app"
