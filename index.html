<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omix Community Platform</title>
    <meta name="description" content="Discord-style community chat PWA">

    <!-- PWA Setup -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#520ff6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Omix Chat">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/logo-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png">
    <link rel="shortcut icon" href="/logo-192.png" type="image/png">

    <!-- Lucide Icons -->
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function(err) {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>

    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
