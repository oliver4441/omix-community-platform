<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md relative overflow-hidden font-body-md selection:bg-primary/30 selection:text-primary">
<!-- Atmospheric Background Effects -->
<div class="absolute top-0 left-1/4 w-[600px] h-[600px] bg-primary-container/10 rounded-full blur-[150px] pointer-events-none transform -translate-y-1/2"></div>
<div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-secondary/5 rounded-full blur-[120px] pointer-events-none transform translate-y-1/3"></div>
<!-- Main Verification Card -->
<main class="w-full max-w-[480px] bg-surface-container-low/80 backdrop-blur-2xl border border-outline-variant/40 rounded-xl p-xl shadow-[0_8px_32px_rgba(0,0,0,0.4)] relative z-10 flex flex-col items-center text-center">
<!-- Animated Icon Container -->
<div class="w-24 h-24 mb-lg rounded-full bg-surface-container-highest/50 flex items-center justify-center border border-outline-variant/50 relative group">
<!-- Glow effect -->
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl group-hover:bg-primary/30 transition-all duration-500"></div>
<!-- Concentric rings for technical feel -->
<div class="absolute inset-2 border border-outline-variant/30 rounded-full border-dashed"></div>
<span class="material-symbols-outlined text-primary text-[40px] relative z-10 drop-shadow-[0_0_12px_rgba(208,188,255,0.5)]" data-icon="forward_to_inbox" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                forward_to_inbox
            </span>
</div>
<!-- Typography -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm tracking-tight">
            Check your inbox
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl max-w-[320px]">
            We've sent a secure verification link to authenticate your workspace access at<br/>
<span class="inline-flex items-center gap-xs text-primary font-code-md text-code-md mt-md px-sm py-[2px] bg-surface-container-highest rounded border border-outline-variant/50 shadow-inner">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
                sys.admin@omix.dev
            </span>
</p>
<!-- Actions -->
<div class="flex flex-col w-full gap-md">
<!-- Primary Action -->
<button class="w-full h-12 bg-primary text-on-primary font-label-caps text-label-caps rounded flex items-center justify-center gap-sm hover:bg-primary-fixed transition-colors active:scale-[0.98] duration-150 shadow-[0_0_20px_rgba(208,188,255,0.1)] hover:shadow-[0_0_24px_rgba(208,188,255,0.2)]">
<span class="material-symbols-outlined text-[18px]" data-icon="outgoing_mail">outgoing_mail</span>
                RESEND VERIFICATION LINK
            </button>
<!-- Secondary Action (Ghost) -->
<button class="w-full h-12 bg-transparent border border-secondary text-secondary font-label-caps text-label-caps rounded flex items-center justify-center gap-sm hover:bg-secondary/10 transition-colors active:scale-[0.98] duration-150">
<span class="material-symbols-outlined text-[18px]" data-icon="edit_square">edit_square</span>
                CHANGE EMAIL ADDRESS
            </button>
</div>
<!-- Footer Note -->
<div class="mt-xl pt-lg border-t border-outline-variant/30 w-full">
<p class="font-body-sm text-body-sm text-outline flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="info">info</span>
                Don't see it? Check your spam folder.
            </p>
</div>
</main>
</body></html>
